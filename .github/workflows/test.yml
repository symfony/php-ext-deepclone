name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: "Linux ${{ matrix.php }} ${{ matrix.zts && 'ZTS' || 'NTS' }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        zts: [false]
        include:
          - php: '8.4'
            zts: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, tidy
          coverage: none
          tools: none
        env:
          phpts: ${{ matrix.zts && 'zts' || 'nts' }}

      - name: phpize
        run: phpize

      - name: configure
        run: ./configure --enable-deepclone CFLAGS="-Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare"

      - name: make
        run: make -j$(nproc)

      - name: Check that the extension loads
        run: php -d extension=modules/deepclone.so -r 'exit((int) !extension_loaded("deepclone"));'

      - name: Link the extensions that the tests load
        run: |
          # "make test" sets extension_dir to modules/
          for ext in bcmath dom mongodb opcache tidy; do
            so="$(php-config --extension-dir)/$ext.so"
            [ ! -f "$so" ] || ln -s "$so" modules/
          done

      - name: make test
        run: |
          export NO_INTERACTION=1
          export REPORT_EXIT_STATUS=1
          export TEST_PHP_JUNIT=junit.xml
          make test TESTS="-q --show-diff tests/"

      - name: Show failing test diffs
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  package-xml:
    name: "package.xml version"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check that package.xml matches PHP_DEEPCLONE_VERSION
        run: |
          header=$(sed -n 's/^#define PHP_DEEPCLONE_VERSION "\(.*\)"$/\1/p' php_deepclone.h)
          release=$(sed -n '0,/<release>/s/.*<release>\(.*\)<\/release>.*/\1/p' package.xml)
          echo "php_deepclone.h: $header, package.xml: $release"
          test -n "$header" && test "$header" = "$release"

  asan:
    name: "Linux 8.5 NTS + ASAN/UBSAN"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf pkg-config bison re2c

      - name: Build PHP 8.5 with ASAN
        run: |
          # A PHP built without ASAN can't load an extension built with it
          mkdir ../php-src
          curl -sL https://github.com/php/php-src/archive/refs/heads/PHP-8.5.tar.gz | tar xz --strip-components=1 -C ../php-src
          cd ../php-src
          ./buildconf --force
          ./configure --enable-debug --enable-address-sanitizer --disable-all --enable-cli --enable-bcmath --disable-cgi --disable-phpdbg
          make -j$(nproc)
          sudo make install
          php -v

      - name: phpize
        run: phpize

      - name: configure with sanitizers
        run: |
          export CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare"
          export LDFLAGS="-fsanitize=address,undefined"
          ./configure --enable-deepclone

      - name: make
        run: make -j$(nproc)

      - name: Check that the extension loads
        run: php -d extension=modules/deepclone.so -r 'exit((int) !extension_loaded("deepclone"));'

      - name: make test
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          USE_ZEND_ALLOC: "0"
          NO_INTERACTION: "1"
          REPORT_EXIT_STATUS: "1"
        run: make test TESTS="-q --show-diff tests/"

      - name: Show failing test diffs
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  debug:
    name: "Linux ${{ matrix.php }} NTS debug build (leak detection)"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf pkg-config bison re2c

      - name: Build PHP ${{ matrix.php }} with --enable-debug
        run: |
          # The head of the branch, to catch what the next patch release changes
          mkdir ../php-src
          curl -sL https://github.com/php/php-src/archive/refs/heads/PHP-${{ matrix.php }}.tar.gz | tar xz --strip-components=1 -C ../php-src
          cd ../php-src
          ./buildconf --force
          # OPcache is always built as of PHP 8.5
          ./configure --enable-debug --disable-all --enable-cli --enable-bcmath ${{ matrix.php == '8.4' && '--enable-opcache' || '' }} --disable-cgi --disable-phpdbg
          make -j$(nproc)
          sudo make install
          php -v

      - name: Build extension
        run: |
          phpize
          ./configure --enable-deepclone
          make -j$(nproc)

      - name: Check that the extension loads
        run: php -d extension=modules/deepclone.so -r 'exit((int) !extension_loaded("deepclone"));'

      - name: Link the extensions that the tests load
        run: |
          # "make test" sets extension_dir to modules/
          for ext in bcmath dom mongodb opcache tidy; do
            so="$(php-config --extension-dir)/$ext.so"
            [ ! -f "$so" ] || ln -s "$so" modules/
          done

      - name: Run tests (Zend MM leak detection active)
        env:
          NO_INTERACTION: "1"
          REPORT_EXIT_STATUS: "1"
        run: make test TESTS="-q --show-diff tests/"

      - name: Run tests with OPcache
        env:
          NO_INTERACTION: "1"
          REPORT_EXIT_STATUS: "1"
        run: make test TESTS="-q --show-diff ${{ matrix.php == '8.4' && '-d zend_extension=opcache' || '' }} -d opcache.enable_cli=1 -d opcache.file_update_protection=0 tests/"

      - name: Show failing test diffs
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  linux32:
    # Native 32-bit Linux build. We can't use a `container:` block here
    # because GitHub injects the x86_64 Node runtime into it and a pure
    # i386 image can't execute it ("exec /__e/node24/bin/node: no such
    # file or directory"). Instead, do checkout on the x86_64 host and
    # spawn the i386 container manually for the build/test step. i386
    # binaries run natively on x86_64 hosts — no qemu involved. Debian
    # Bookworm ships PHP 8.2 on i386 and Trixie ships PHP 8.4, which is
    # enough to validate the source compiles and runs correctly when
    # sizeof(zend_long) == 4. The job stays on ubuntu-24.04: on
    # ubuntu-26.04, the container fails to resolve deb.debian.org.
    name: "Linux i386 PHP ${{ matrix.php }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            debian: bookworm
          - php: '8.4'
            debian: trixie

    steps:
      - uses: actions/checkout@v7

      - name: Build and test inside i386/debian:${{ matrix.debian }}
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/work" -w /work \
            -e NO_INTERACTION=1 -e REPORT_EXIT_STATUS=1 \
            i386/debian:${{ matrix.debian }} sh -eu -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential autoconf pkg-config ca-certificates \
                php-cli php-dev
              phpize
              ./configure --enable-deepclone \
                CFLAGS="-Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare"
              make -j"$(nproc)"
              php -d extension=modules/deepclone.so -r "exit((int) !extension_loaded(\"deepclone\"));"
              make test TESTS="-q --show-diff tests/"
            '

      - name: Show failing test diffs
        if: failure()
        run: |
          for f in tests/*.diff tests/*.out tests/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  macos:
    name: "macOS ${{ matrix.php }}"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.6']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, tidy
          coverage: none
          tools: none

      - name: build & test
        run: |
          phpize
          ./configure --enable-deepclone
          make -j$(sysctl -n hw.ncpu)
          php -d extension=modules/deepclone.so -r 'exit((int) !extension_loaded("deepclone"));'
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS="-q --show-diff tests/"

  windows-matrix:
    # Generate a Windows build matrix (PHP version × arch × ts × VS toolset)
    # via the official php/php-windows-builder action — the same recipe used
    # by ext/xdebug, ext/apcu, ext/uopz and other PECL extensions.
    name: "Windows build matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5, 8.6'
          arch-list: 'x64'

  windows:
    name: "Windows ${{ matrix.php-version }} ${{ matrix.arch }} ${{ matrix.ts }}"
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.windows-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --enable-deepclone

  release:
    # On tag pushes, collect every Windows build artifact uploaded by the
    # `windows` matrix above and attach the resulting DLLs to the GitHub
    # release. PIE will then download the matching prebuilt DLL on Windows
    # instead of asking the user to compile from source.
    name: "Publish Windows DLLs to release"
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: php/php-windows-builder/release@v1
        with:
          release: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
